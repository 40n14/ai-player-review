<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩家视角审查</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234fd1c5'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpath d='M16 7l9 9-9 9-9-9z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #121418; --panel: #1a1d23; --panel2: #22262e; --side: #16181d; --line: #2c313b; --text: #e8eaed; --dim: #9aa3b2; --accent: #4fd1c5;
  --accent-bg: #163331; --s: #ff8a80; --s-bg: #3a1f1f; --m: #fbbf24; --m-bg: #3a2e14; --l: #b3bac6; --l-bg: #2a2f38;
  --d: #c4b5fd; --d-bg: #2c2444; --w: #93c5fd; --w-bg: #1b2a47; --good: #86efac; --good-bg: #173022; --pri-text: #0b1f1d;
}
:root[data-theme=light] {
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #f3f4f6; --side: #eef0f3; --line: #e0e3e8; --text: #1c2128; --dim: #667085; --accent: #0f766e;
  --accent-bg: #e3f3f1; --s: #c62828; --s-bg: #fdecea; --m: #b45309; --m-bg: #fdf3e2; --l: #6b7280; --l-bg: #eef0f3;
  --d: #6d28d9; --d-bg: #f1eafd; --w: #1d4ed8; --w-bg: #e8effd; --good: #15803d; --good-bg: #e7f6ec; --pri-text: #ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
select, input[type=text], input[type=number], textarea { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--pri-text); font-weight: 600; }
.btn.big { padding: 10px 22px; font-size: 16px; }
.btn.sm { padding: 2px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100vh; }
.app.chat-on { grid-template-columns: 220px minmax(0, 1fr) 5px var(--chatw, 400px); }
.drag { cursor: col-resize; background: transparent; border-left: 1px solid var(--line); display: none; }
.app.chat-on .drag { display: block; }
.drag:hover, .drag.on { background: var(--accent-bg); }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 10px; gap: 4px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 0 6px 10px; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--w)); display: grid; place-items: center; color: var(--pri-text); font-size: 14px; }
.side .lbl { font-size: 12px; color: var(--dim); padding: 6px 8px 2px; }
.side select { width: 100%; margin-bottom: 8px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
.nav:hover { background: var(--panel2); }
.nav.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nav .ic { width: 20px; text-align: center; }
.nav .n { margin-left: auto; font-size: 12px; min-width: 22px; text-align: center; border-radius: 10px; background: var(--s-bg); color: var(--s); padding: 0 6px; }
.side .grow { flex: 1; }
.main { overflow: auto; min-width: 0; }
.wrap { max-width: 980px; margin: 0 auto; padding: 26px 28px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.sub { color: var(--dim); margin: 0 0 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row2 > .card { margin-bottom: 0; }
@media (max-width: 900px) { .row2 { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .side { flex-direction: row; flex-wrap: wrap; } .side .grow, .side .lbl { display: none; } .nav { width: auto; } }
.note { background: var(--m-bg); color: var(--m); border-radius: 10px; padding: 8px 14px; margin-bottom: 16px; font-size: 14px; }
.next { border: 2px solid var(--accent); }
.next .what { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 6px 0 12px; }
.num { border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.num b { display: block; font-size: 30px; line-height: 1.1; }
.num span { font-size: 13px; }
.kS { color: var(--s); background: var(--s-bg); } .kM { color: var(--m); background: var(--m-bg); } .kL { color: var(--l); background: var(--l-bg); }
.kD { color: var(--d); background: var(--d-bg); } .kW { color: var(--w); background: var(--w-bg); }
.prog { height: 8px; background: var(--l-bg); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.prog i { display: block; height: 100%; background: var(--accent); }
.prog.warn i { background: var(--m); } .prog.over i { background: var(--s); }
.usage { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; margin: 0 0 6px; cursor: pointer; font-size: 13px; line-height: 1.5; }
.usage:hover { border-color: var(--accent); }
.usage .sm { color: var(--dim); font-size: 12px; }
.usage .prog { height: 6px; margin: 4px 0 2px; }
.fix { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.fix .item { gap: 10px; }
.fix .fx { padding: 2px 16px 6px; border-top: 1px dashed var(--line); }
.fixbtns { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px 12px; }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px 6px 12px; margin: 8px 0; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
.cmd code { flex: 1; overflow-x: auto; white-space: nowrap; }
.tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 8px; line-height: 22px; white-space: nowrap; }
.t-money { background: var(--m-bg); color: var(--m); } .t-free { background: var(--good-bg); color: var(--good); } .t-sub { background: var(--w-bg); color: var(--w); }
.t-bad { background: var(--s-bg); color: var(--s); } .t-warn { background: var(--m-bg); color: var(--m); } .t-want { background: var(--w-bg); color: var(--w); }
.t-good { background: var(--good-bg); color: var(--good); } .t-gray { background: var(--l-bg); color: var(--l); } .t-dec { background: var(--accent-bg); color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--l); }
.dot.ok { background: var(--good); } .dot.no { background: var(--s); }
.steps { counter-reset: s; }
.step { position: relative; padding: 4px 0 14px 40px; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 4px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
.step b { display: block; margin-bottom: 2px; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.players .card { margin: 0; }
.say { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); align-items: flex-start; }
.say:first-of-type { border-top: 0; }
a.ref { font-size: 12px; border-radius: 5px; padding: 0 6px; margin: 0 2px; cursor: pointer; font-weight: 600; text-decoration: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 3px 12px; cursor: pointer; font-size: 14px; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.split { display: grid; grid-template-columns: minmax(280px, 2fr) minmax(0, 3fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--panel2); } .item.on { background: var(--accent-bg); }
.item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sev { font-size: 12px; border-radius: 6px; padding: 0 8px; white-space: nowrap; }
.decide { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; padding: 12px; background: var(--panel2); border-radius: 12px; }
.decide input { flex: 1; min-width: 180px; }
.md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; font-size: 15px; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--dim); }
code { background: var(--panel2); border-radius: 5px; padding: 0 5px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
pre { background: var(--panel2); border-radius: 10px; padding: 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
pre code { padding: 0; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 14px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { color: var(--dim); font-weight: 600; white-space: nowrap; }
details > summary { cursor: pointer; color: var(--dim); margin: 6px 0; }
.empty { color: var(--dim); text-align: center; padding: 40px 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.files .f { padding: 7px 12px; cursor: pointer; border-radius: 8px; word-break: break-all; }
.files .f:hover { background: var(--panel2); } .files .f.on { background: var(--accent-bg); color: var(--accent); }
.files .g { font-size: 12px; color: var(--dim); padding: 10px 12px 2px; }
.opt { display: block; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; margin-bottom: 8px; }
.opt.on { border-color: var(--accent); background: var(--accent-bg); }
.opt small { display: block; color: var(--dim); }
/* the side chat */
.chat { background: var(--panel); display: none; flex-direction: column; min-width: 0; min-height: 0; }
.app.chat-on .chat { display: flex; }
.chat .hd { display: flex; align-items: center; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.chat .hd b { flex: 1; font-size: 15px; }
.icon { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--dim); display: grid; place-items: center; font-size: 15px; }
.icon:hover { background: var(--panel2); color: var(--text); }
.chat .log { flex: 1; overflow: auto; padding: 16px 16px 8px; }
.hello { color: var(--dim); text-align: center; padding: 30px 8px 10px; }
.hello b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.sugg { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
.sugg button { text-align: left; border: 1px solid var(--line); background: var(--panel2); border-radius: 12px; padding: 9px 12px; cursor: pointer; }
.sugg button:hover { border-color: var(--accent); }
.you { display: flex; justify-content: flex-end; margin: 4px 0 14px; }
.you div { background: var(--panel2); border-radius: 16px; padding: 8px 14px; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
.ai { margin: 0 0 18px; }
.ai .md p:first-child { margin-top: 0; }
.ai .bar { display: flex; gap: 4px; align-items: center; color: var(--dim); font-size: 12px; margin-top: 2px; }
.ai.err { color: var(--s); }
.think { color: var(--dim); display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
.composer { margin: 8px 12px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel2); padding: 8px 8px 6px 12px; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { width: 100%; border: 0; background: none; resize: none; outline: none; padding: 4px 0; min-height: 24px; max-height: 200px; line-height: 1.6; }
.composer .tools { display: flex; align-items: center; gap: 6px; }
.composer select { border: 0; background: none; color: var(--dim); font-size: 13px; padding: 2px 4px; border-radius: 6px; cursor: pointer; }
.composer select:hover { background: var(--panel); color: var(--text); }
.composer .sp { flex: 1; }
.send { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent); color: var(--pri-text); cursor: pointer; font-size: 16px; font-weight: 700; display: grid; place-items: center; }
.send:disabled { background: var(--line); color: var(--dim); cursor: default; }
.hint { color: var(--dim); font-size: 12px; text-align: center; margin: -4px 12px 10px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 7px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: .92; }
/* the confirm box, the small box of a running check, forms */
.modal-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; z-index: 8; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; width: min(580px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
.modal p { margin: 8px 0; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.jobbox { display: block; width: 100%; text-align: left; border: 1px solid var(--accent); background: var(--accent-bg); color: var(--accent); border-radius: 10px; padding: 7px 10px; margin: 0 0 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.jobbox .prog { height: 6px; margin: 4px 0 2px; }
.t-row { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); }
.t-row:first-child { border-top: 0; }
.form label.f { display: block; margin: 8px 0; }
.form label.f > span { display: block; font-size: 13px; color: var(--dim); }
.form input[type=text] { width: 100%; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 1s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">&#9670;</span>玩家视角审查</div>
    <div class="lbl">在看哪个游戏</div>
    <select id="selProject"></select>
    <div id="nav"></div>
    <div class="grow"></div>
    <div id="jobbox"></div>
    <div id="usage"></div>
    <button class="nav" id="btnHelp"><span class="ic">?</span>问 AI 怎么用</button>
    <button class="nav" data-view="settings" id="navSettings"><span class="ic">&#9881;</span>设置</button>
    <button class="nav" id="btnQuit" title="关掉页面的服务"><span class="ic">&#9211;</span>退出</button>
  </aside>
  <div class="main" id="main"><div class="empty">正在打开……</div></div>
  <div class="drag" id="drag" title="拖动改宽度"></div>
  <aside class="chat" id="chat"></aside>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>
'use strict';
const TOKEN = '__PRK_TOKEN__';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { ov: null, rid: null, round: null, view: 'home', sel: null, filter: 'all', todo: false, file: null, fileData: null, lib: null, costs: null, decRows: null,
  more: 'files', find: '', chat: [], asking: false, okCost: false, help: false, draft: '', fixes: null, fixSel: null, fixing: null,
  run: { groups: null, split: false, map: true, parallel: 4, who: '', kind: '', model: '' },
  // a check started from the page: its state (/api/jobs), the last「先试一下」, the confirm box
  job: null, watching: null, pollT: null, plan: null, planning: false, modal: null,
  // forms: the provider's key (settings), this computer, a new game
  pform: null, pedit: null, pformLoading: false, medit: null, newForm: null, newEdit: {}, newErr: '', newFields: {} };
// plain words for everything the files call by a technical name
const SEV = { S: '严重', M: '一般', L: '小问题', D: '要你拿主意', W: '玩家想要的' };
const NAV = [['home', '首页', '⌂'], ['feedback', '玩家说了什么', '❝'], ['problems', '要处理的问题', '☰'], ['fixes', '待修清单', '✎'], ['run', '开始一次检查', '▶'], ['costs', '花了多少钱', '¥'], ['more', '更多', '…']];
const DECIDE = [['修', '要修'], ['放进待做', '以后再说'], ['是设计', '本来就这样'], ['不是问题', '不是问题'], ['误报', 'AI 看错了']];
const decLabel = v => (DECIDE.find(d => d[0] === v) || [v, v])[1];
const sure = c => /确定没有/.test(c) ? '确定没有这个选项' : /可能没有/.test(c) ? '可能没有' : /确定/.test(c) ? '确定有' : /可能/.test(c) ? '可能有，要进游戏看看' : /设计/.test(c) ? '按设计就是这样' : c;
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'X-PRK-Token': TOKEN }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined });
  try { return await r.json(); } catch (e) { return { ok: false, error: '没有回应（' + r.status + '）' }; }
}
function toast(t, ms) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms || 1800); }
async function copy(t, msg) {
  try { await navigator.clipboard.writeText(t); } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(msg || '复制好了，去终端里粘贴');
}
const wan = n => n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万' : String(n || 0);
// paths under the home folder hold the account name: shown as %USERPROFILE% (what gets copied is the real path, so commands work)
function show(t) { const h = S.ov && S.ov.home; return h && h.length > 3 ? String(t ?? '').split(new RegExp(h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i')).join('%USERPROFILE%') : String(t ?? ''); }
// costs: false = 不花钱; true = 要花钱 (按次付费, or not chosen yet); 'sub' = 用会员额度
function cmdBox(c, costs) {
  const tag = costs === 'sub' ? '<span class="tag t-sub">用会员额度</span>' : costs ? '<span class="tag t-money">要花钱</span>' : '<span class="tag t-free">不花钱</span>';
  return '<div class="cmd"><code>' + esc(show(c)) + '</code>' + tag + '<button class="btn sm" data-copy="' + esc(c) + '">复制</button></div>';
}
// how a command that runs AI is paid, as cmdBox wants it
const payTag = p => p === 'sub' ? 'sub' : true;
const PAYTXT = {
  sub: ['用会员额度', '用这台电脑上登录的账号，不另外花钱，但会用掉你的额度。'],
  api: ['按次付费', '用钥匙（key），用多少花多少钱。']
};
const curProvider = () => (S.ov.providers || []).find(x => x.id === S.ov.model.provider) || {};

/* ---------- a small Markdown renderer (the reports are Markdown) ---------- */
function md(text, opts) {
  opts = opts || {};
  const il = s => {
    let h = esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    if (opts.ids) h = h.replace(/(?<![-\w])([SMLDW]\d+)\b/g, m => opts.ids.has(m) ? '<a class="ref k' + m[0] + '" data-ref="' + m + '">' + m + '</a>' : m);
    return h;
  };
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const isList = l => /^\s*([-*]|\d+[.、)])\s+/.test(l);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (/^\s*$/.test(ln)) { i++; continue; }
    let m = ln.match(/^(#{1,6})\s+(.*)$/);
    if (m) { const n = Math.min(m[1].length + (opts.shift || 0), 6); out.push('<h' + n + '>' + il(m[2]) + '</h' + n + '>'); i++; continue; }
    if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
      const head = cells(ln); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table><thead><tr>' + head.map(c => '<th>' + il(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + il(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (isList(ln)) {
      let html = ''; const stack = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && stack.length))) {
        const mm = lines[i].match(/^(\s*)([-*]|\d+[.、)])\s+(.*)$/);
        if (!mm) { html += '<br>' + il(lines[i].trim()); i++; continue; }
        const ind = mm[1].length, tag = /\d/.test(mm[2]) ? 'ol' : 'ul';
        while (stack.length && stack[stack.length - 1].ind > ind) html += '</li></' + stack.pop().tag + '>';
        if (!stack.length || stack[stack.length - 1].ind < ind) { html += '<' + tag + '><li>'; stack.push({ ind, tag }); } else html += '</li><li>';
        html += il(mm[3]); i++;
      }
      while (stack.length) html += '</li></' + stack.pop().tag + '>';
      out.push(html); continue;
    }
    if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(il).join('<br>') + '</blockquote>'); continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !isList(lines[i])) { buf.push(lines[i]); i++; }
    if (buf.length) out.push('<p>' + buf.map(il).join('<br>') + '</p>'); else { out.push('<p>' + il(ln) + '</p>'); i++; }
  }
  return '<div class="md">' + out.join('\n') + '</div>';
}

async function loadAll(keep) {

  if (previous && previous !== S.ov.project?.file) { keep = false; S.run.groups = null; }
  const rs = S.ov.rounds || [];
  if (!keep || !rs.some(r => r.id === S.rid)) {
    const first = rs.find(r => r.hasReport && !r.sample) || rs.find(r => r.hasReport) || rs[0];

  }

function fixCard(x, d) {
  const open = S.fixSel === x.id, k = (x.entry || 'L')[0], busy = S.fixing === x.id;

    (!x.done && x.canUndo ? '<span class="tag t-warn">AI 改过一次</span>' : '') + '<span class="sub" style="margin:0;font-size:13px">' + (open ? '收起' : '看全文') + '</span></div>';
  if (x.done) h += '<div class="fx">' + (x.hasFill ? md(x.filledText) : '<p class="sub" style="margin:6px 0">「修完填这里」是空的：没写改了什么。</p>') + '</div>';

async function fixAction(act, id, fixes = S.fixes) {
  if (act === 'run') {
    if (S.fixing) return toast('AI 还在修 ' + S.fixing + '，等它修完');
    const round = S.rid, item = fixes?.items?.find(x => x.id === id && !x.done), binding = item?.confirmation;
    if (!binding?.report) return toast('找不到这条待修记录的轮次或原报告', 4000);
    const pay = binding.pay;
    if (!pay) { toast('先选用什么付'); S.view = 'settings'; return draw(); }
    const how = (pay === 'sub' ? '用会员额度' : '按次付费，要花钱') + '，' + (fixes.providerName || binding.provider) + ' 的「' + (binding.model || '默认型号') + '」';
    if (!confirm('让 AI 直接修 ' + id + ' 「' + binding.title + '」？\n\n项目设置：' + show(binding.project) +
      '\n轮次：' + binding.round + '\n原报告：' + show(binding.report) + '\n报告条目：' + binding.entry +
      '\n怎么付：' + how + '\n\nAI 只看清单和游戏的规矩，效果可能和你在自己的对话里直接修不同。改之前先备份，改坏了可以撤回。')) return;
    S.fixing = id; draw();
    const r = await api('/api/fix', { action: 'run', round, id, confirmation: binding, confirmed: true });
    S.fixing = null; S.costs = null;
    if (r?.changed?.length) {
      await loadAll(true);
      const fresh = await api('/api/fixes?round=' + encodeURIComponent(S.rid || ''));
      if (fresh?.ok && !fresh.runProblem && fresh.items.some(x => x.id === id && !x.done && x.confirmation?.report)) {
        toast('信息已更新，请重新确认。', 4000);
        return fixAction(act, id, fresh);
      }
      return toast(r.error || '这条已经不能直接修。', 4000);
    }
    if (r && r.ok) toast(id + ' 修好了，挪到下面了', 3000);
    else alert(show((r && r.error) || '没修成。') + (r && r.tail ? '\n\n日志的最后几行：\n' + show(r.tail) : ''));
    if (r?.missing?.length) alert('没找到或不许碰的出处文件：\n' + r.missing.map(show).join('\n'));
    return loadAll(true);
  }
  const binding = fixes?.items?.find(x => x.id === id)?.actionBinding;
  if (!binding) { toast('请刷新待修清单后再操作。'); return loadAll(true); }
  if (act === 'undo' && !confirm('撤回 ' + id + '「' + binding.title + '」？\n\n项目设置：' + show(binding.project) +
    '\n轮次：' + binding.round + '\n会照备份改回文件，并把这条放回「还没修的」。')) return;
  const r = await api('/api/fix', { action: act, round: S.rid, id, confirmation: binding });
  if (r?.changed?.length) {
    await loadAll(true);
    return toast('待修清单已刷新，请核对后重新操作。', 4000);
  }
  if (!r || !r.ok) { alert(show((r && r.error) || '没做成。')); return loadAll(true); }
  if (act === 'undo') {
    toast('改回去了 ' + r.restored.length + ' 个文件，' + id + ' 放回了还没修的', 3000);
    if (r.noBackup && r.noBackup.length) alert('这些文件没有备份，没法撤回（AI 说它改过）：\n' + r.noBackup.map(show).join('\n'));
  } else toast(act === 'done' ? id + ' 标成修好了' : id + ' 放回了还没修的');
  return loadAll(true);
}

    '</select><span class="sp"></span><button class="send" id="btnAsk" title="发送（Enter）"' + (S.asking ? ' disabled' : '') + '>↑</button></div></div>' +
    '<div class="hint">Enter 发送，Shift + Enter 换行</div>';
  const t = $('#q'); t.value = S.draft || ''; grow(t);

function grow(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; }
function openChat(q) { S.help = true; store('prk.chat', '1'); if (q !== undefined) S.draft = q; S.focusChat = true; draw(); }
async function askGuide(q) {
  q = (q || '').trim();
  if (!q || S.asking) return;
  const mode = S.ov.guidePay || '';
  if (!mode) { toast('先在左下角选用什么付'); const s = $('#selMode'); if (s) s.focus(); return; }
  if (mode === 'api' && !S.okCost) {
    if (!confirm('按次付费：问这一次要花一点钱（一般几分钱到几毛钱）。继续吗？\n（这次打开页面期间不再问）')) return;
    S.okCost = true;
  }
  const history = [];
  for (let i = 0; i + 1 < S.chat.length; i += 2) if (S.chat[i].q && S.chat[i + 1].a) history.push({ q: S.chat[i].q, a: S.chat[i + 1].a });
  const qe = $('#q'); if (qe) qe.value = '';     // drawHelp keeps what is in the box: empty it first
  S.chat.push({ q }); S.asking = true; S.draft = ''; S.focusChat = true; draw();
  const r = await api('/api/guide', { question: q, mode, history: history.slice(-3), confirmed: true });
  S.asking = false; S.focusChat = true;
  if (r && r.ok) S.chat.push({ a: r.answer, meta: r.seconds + ' 秒 · ' + (mode === 'api' ? '按次付费' + (r.cost != null ? ' · 花了 ' + Number(r.cost).toFixed(4) + ' 美元' : '') : '用会员额度') });
  else S.chat.push({ err: (r && r.error) || '没有回答。' });
  if (r && r.stale) { S.chat.pop(); S.chat.pop(); S.draft = q; S.okCost = false; toast(r.error); return loadAll(true); }
  draw();
}

document.addEventListener('click', async ev => {

  }
  if (t.dataset.copy !== undefined) return copy(t.dataset.copy);

    if (t.dataset.round && t.dataset.round !== S.rid) { S.rid = t.dataset.round; return loadRound(false); }

  if (t.dataset.expand !== undefined) return openStart('expand', { items: t.dataset.expand, round: t.dataset.round, report: t.dataset.report });
  if (t.dataset.gotround) {
    S.rid = t.dataset.gotround; S.view = t.dataset.goto === 'files' ? 'more' : 'feedback'; S.more = 'files';

  }

    const r = await api('/api/jobs/stop', {});

  if (t.id === 'btnJobClear') {

    if (!r || !r.ok) { toast((r && r.error) || '没核成', 4000); return draw(); }
    S.rid = r.round; await loadRound(false);

  if (t.dataset.ref) {

    else body = { [t.name]: t.value };
    const r = await api('/api/pay', body);
    S.okCost = false;
    toast(r && r.ok ? '记住了' : ((r && r.error) || '没记上'));
    return loadAll(true);
  }
  if (t.name === 'theme') return setTheme(t.value);
  if (t.dataset.group) { t.checked ? S.run.groups.add(t.dataset.group) : S.run.groups.delete(t.dataset.group); return draw(); }
  if (t.id === 'runSplit') { S.run.split = t.checked; return draw(); }
  if (t.id === 'runMap') { S.run.map = t.checked; return draw(); }
});
// typing only keeps what is typed: no redraw (a redraw would take away the button the person is about to click)
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'runPar') { S.run.parallel = Math.max(1, Math.min(12, parseInt(t.value, 10) || 1)); return; }
  if (t.id === 'runWho') { S.run.who = t.value; return; }
  if (t.id === 'runModel') { S.run.model = t.value.trim().replace(/[^A-Za-z0-9._:\-\[\]\/@~]/g, ''); return; }
  if (t.dataset.pf && S.pedit) { S.pedit['f_' + t.dataset.pf] = t.value; return; }
  if (t.id === 'pfKeyFile' && S.pedit) { S.pedit.keyFile = t.value; return; }
  if (t.id === 'pfKeyEnv' && S.pedit) { S.pedit.keyEnv = t.value; return; }
  if (t.id === 'pfModel' && S.pedit) { S.pedit.model = t.value; return; }
  if (t.id === 'mPython' && S.medit) { S.medit.python = t.value; return; }
  if (t.id === 'mClaude' && S.medit) { S.medit.claudeExe = t.value; return; }
  if (t.dataset.np && t.type === 'text') { S.newEdit[t.dataset.np] = t.value; return; }
  if (ev.target.id === 'q') { S.draft = ev.target.value; grow(ev.target); return; }
  if (ev.target.id === 'find') { S.find = ev.target.value; const pos = ev.target.selectionStart; draw(); const el = $('#find'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'q' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); askGuide(ev.target.value); }
  if (ev.key === 'Escape' && S.modal && !S.modal.starting) { S.modal = null; drawModal(); }
});
async function copyPlain(t) { try { await navigator.clipboard.writeText(t); } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } toast('复制好了'); }
// drag the line between the page and the chat to change the chat's width (remembered)
(function () {
  const d = $('#drag'); let on = false;
  const w = parseInt(store('prk.chatw') || '', 10); if (w > 280) document.documentElement.style.setProperty('--chatw', w + 'px');
  d.addEventListener('mousedown', e => { on = true; d.classList.add('on'); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (!on) return; const nw = Math.max(300, Math.min(window.innerWidth - 520, window.innerWidth - e.clientX)); document.documentElement.style.setProperty('--chatw', nw + 'px'); });
  window.addEventListener('mouseup', () => { if (!on) return; on = false; d.classList.remove('on'); store('prk.chatw', parseInt(getComputedStyle(document.documentElement).getPropertyValue('--chatw'), 10)); });
})();
S.help = store('prk.chat') === '1';
function setTheme(v) { document.documentElement.dataset.theme = v; store('prk.theme', v); draw(); }
document.documentElement.dataset.theme = store('prk.theme') === 'light' ? 'light' : 'dark';
// heartbeat: while a window is open the service keeps running; after the last one closes it stops by itself
function ping() { fetch('/api/ping', { headers: { 'X-PRK-Token': TOKEN } }).catch(() => {}); }
ping(); setInterval(ping, 20000);
loadAll(false);
</script>
